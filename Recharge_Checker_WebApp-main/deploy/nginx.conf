# /etc/nginx/sites-available/dishhome_webapp
# Then: sudo ln -s /etc/nginx/sites-available/dishhome_webapp /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name report.yourdomain.com;   # <-- change this, or use your VPS IP for now

    client_max_body_size 20M;   # CSV uploads are processed in-browser, but keep this generous

    location /static/ {
        alias /opt/dishhome_webapp/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/opt/dishhome_webapp/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After running certbot (see DEPLOYMENT.md), it will auto-add a matching
# `listen 443 ssl;` server block above and redirect port 80 -> 443 for you.
