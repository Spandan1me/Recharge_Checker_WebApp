<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - DishHome Analytics</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }
    .box {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, .1);
        width: 340px;
    }
    h2 { color: #1C2E54; margin-bottom: 20px; }
    input {
        width: 100%;
        padding: 10px;
        margin-bottom: 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
    }
    button {
        width: 100%;
        padding: 10px;
        background: #F36F21;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover { background: #E05A1A; }
    .err {
        color: #dc3545;
        margin-bottom: 10px;
        font-size: .85rem;
        background: #f8d7da;
        padding: 8px 10px;
        border-radius: 6px;
        border-left: 4px solid #dc3545;
    }
</style>
</head>
<body>
<form class="box" method="POST">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <h2>🔄 DishHome Analytics</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="text" name="username" placeholder="Username" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Log In</button>
</form>
</body>
</html>
